<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habblet</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <video id="video" autoplay loop playsinline>
        <source src="video.mp4?v=10" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("video");

        video.muted = false;
        video.volume = 1;

        function iniciarVideo() {
            video.muted = false;
            video.volume = 1;

            const tentativa = video.play();

            if (tentativa !== undefined) {
                tentativa.catch(() => {
                    // O navegador bloqueou o autoplay com áudio.
                    // Tenta novamente na primeira interação do visitante.
                });
            }
        }

        window.addEventListener("load", iniciarVideo);

        document.addEventListener("click", iniciarVideo);
        document.addEventListener("touchstart", iniciarVideo);
        document.addEventListener("keydown", iniciarVideo);

        video.addEventListener("volumechange", () => {
            if (video.muted) {
                video.muted = false;
            }

            if (video.volume !== 1) {
                video.volume = 1;
            }
        });
    </script>

</body>
</html>
