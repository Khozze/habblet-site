<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <title>Habblet </title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

<video id="video" autoplay loop playsinline>
    <source src="video.mp4?v=20" type="video/mp4">
</video>

<script>
    const video = document.getElementById("video");

    video.muted = false;
    video.volume = 1;

    video.play().catch(() => {
        // Navegador bloqueou autoplay com áudio
    });

    function ativar() {
        video.muted = false;
        video.volume = 1;
        video.play();
    }

    document.addEventListener("click", ativar);
    document.addEventListener("touchstart", ativar);
    document.addEventListener("keydown", ativar);
</script>

</body>
</html>
