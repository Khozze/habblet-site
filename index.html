<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #aviso {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="aviso">Clique para ativar o som</div>

<video id="video" autoplay muted loop playsinline>
    <source src="video.mp4?v=3" type="video/mp4">
</video>

<script>
    const video = document.getElementById('video');
    const aviso = document.getElementById('aviso');

    document.addEventListener('click', () => {
        video.muted = false;
        video.volume = 1;
        video.play();
        aviso.style.display = 'none';
    }, { once: true });
</script>

</body>
</html>
