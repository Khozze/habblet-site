<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #entrar {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 28px;
            cursor: pointer;
            background: black;
        }
    </style>
</head>

<body>

<div id="entrar">ENTRAR</div>

<video id="video" loop playsinline>
    <source src="video.mp4?v=30" type="video/mp4">
</video>

<script>
    const entrar = document.getElementById('entrar');
    const video = document.getElementById('video');

    entrar.addEventListener('click', async () => {
        entrar.style.display = 'none';
        video.style.display = 'block';

        video.muted = false;
        video.volume = 1;

        await video.play();
    });
</script>

</body>
</html>
