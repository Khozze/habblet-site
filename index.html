<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habblet</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #tela {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 10;
            cursor: pointer;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            background: black;
        }
    </style>
</head>

<body>

<div id="tela"></div>

<video id="video" loop playsinline>
    <source src="video.mp4?v=50" type="video/mp4">
</video>

<script>
    const tela = document.getElementById("tela");
    const video = document.getElementById("video");

    tela.addEventListener("click", async () => {
        tela.style.display = "none";
        video.style.display = "block";

        video.muted = false;
        video.volume = 1;
        video.currentTime = 0;

        await video.play();
    });
</script>

</body>
</html>
